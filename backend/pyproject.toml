[project]
name = "nextup-backend"
version = "0.1.0"
description = "AI sports film analysis - API + worker (Phase 1 skeleton)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
]

[dependency-groups]
cv = [
    "av==15.1.0",
    "boxmot==25.0.0",
    "opencv-python==4.14.0.94",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "ultralytics==8.4.155",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "flower>=2.0",
]
remote = [
    "modal==1.5.4",
]

[tool.uv.dependency-groups]
cv = {requires-python = ">=3.11,<3.14"}

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
