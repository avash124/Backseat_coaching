services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nextup
      POSTGRES_PASSWORD: nextup
      POSTGRES_DB: nextup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # minio/minio and minio/mc are no longer published (Docker Hub repos deleted,
  # quay.io needs a login). Silo is the community fork of the MinIO server; it
  # keeps the MINIO_* variables, the `server` command and the data format.
  # CORS: with no bucket CORS rule set, the server allows every origin
  # (MINIO_API_CORS_ALLOW_ORIGIN defaults to "*"), so the browser can PUT
  # upload parts from http://localhost:3000 with no extra setting.
  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

  # one-shot: create the bucket + allow anonymous GETs (used with S3_PUBLIC_URL)
  createbucket:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minio minio12345) do echo waiting for minio; sleep 1; done;
      /usr/bin/mc mb -p local/nextup;
      /usr/bin/mc anonymous set download local/nextup;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
